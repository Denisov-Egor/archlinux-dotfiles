# ==========================================
# FASTIK TERMINAL THEME
# Midnight Graphite / Blue
# ==========================================

foreground              #e6e7eb
background              #222530

selection_foreground    #222530
selection_background    #8aadf4

cursor                  #8aadf4
cursor_text_color       #222530

url_color               #8aadf4

active_tab_foreground   #e6e7eb
active_tab_background   #303442
inactive_tab_foreground #9aa0ad
inactive_tab_background #292d3a

# black
color0  #20232c
color8  #555b6e

# red
color1  #ed8796
color9  #f38ba8

# green
color2  #a6da95
color10 #b7e3a5

# yellow
color3  #eed49f
color11 #f5dcae

# blue
color4  #8aadf4
color12 #9bbcff

# magenta
color5  #c6a0f6
color13 #d2b5ff

# cyan
color6  #8bd5ca
color14 #9de5dc

# white
color7  #cdd0d8
color15 #f0f1f5

# ==========================================
# FONT
# ==========================================

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 12

# ==========================================
# WINDOW
# ==========================================

background_opacity 0.96

window_padding_width 12

hide_window_decorations yes

confirm_os_window_close 0

enable_audio_bell no

cursor_shape beam
cursor_blink_interval 0.5

# ==========================================
# TABS
# ==========================================

tab_bar_style powerline

tab_powerline_style slanted

tab_title_template "{index}: {title}"

active_tab_font_style bold
inactive_tab_font_style normal

# ==========================================
# SCROLLBACK
# ==========================================

scrollback_lines 10000

# ==========================================
# URL
# ==========================================

url_style curly
open_url_with default

# ==========================================
# PERFORMANCE
# ==========================================

repaint_delay 10
input_delay 2
sync_to_monitor yes