# =============================================================================
# HYPRLOCK — DARK MINIMAL
# =============================================================================

# -----------------------------------------------------------------------------
# BACKGROUND
# -----------------------------------------------------------------------------

background {
    monitor =
    path = screenshot
    color = rgba(15, 15, 18, 1.0)

    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    grace = 0
    ignore_empty_input = false
}

# -----------------------------------------------------------------------------
# INPUT FIELD
# -----------------------------------------------------------------------------

input-field {
    monitor =
    size = 320, 60

    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(35, 35, 42)
    inner_color = rgb(25, 25, 30)

    font_color = rgb(230, 230, 235)

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <i>Введите пароль...</i>
    hide_input = false

    rounding = 12

    check_color = rgb(80, 200, 140)
    fail_color = rgb(220, 70, 70)

    fail_text = <i>Неверный пароль</i>
    fail_transition = 300

    capslock_color = rgb(220, 180, 70)
    numlock_color = -1
    bothlock_color = -1

    invert_numlock = false
    swap_font_color = false

    position = 0, -80
    halign = center
    valign = center
}

# -----------------------------------------------------------------------------
# TIME
# -----------------------------------------------------------------------------

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"

    color = rgba(235, 235, 240, 1.0)

    font_size = 96
    font_family = JetBrainsMono Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

# -----------------------------------------------------------------------------
# DATE
# -----------------------------------------------------------------------------

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"

    color = rgba(180, 180, 190, 1.0)

    font_size = 24
    font_family = JetBrainsMono Nerd Font

    position = 0, 35
    halign = center
    valign = center
}

# -----------------------------------------------------------------------------
# USER
# -----------------------------------------------------------------------------

label {
    monitor =
    text = $USER

    color = rgba(220, 220, 225, 1.0)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, -180
    halign = center
    valign = center
}